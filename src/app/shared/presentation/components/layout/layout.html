<mat-sidenav-container class="layout-container">
  <mat-sidenav id="module-menu" [mode]="narrow() ? 'over' : 'side'" [opened]="!narrow() || mobileOpen()"
    (closedStart)="mobileOpen.set(false)" class="sidenav">
    <a class="brand" routerLink="/child-profile" (click)="mobileOpen.set(false)">
      <span class="brand-mark"><mat-icon aria-hidden="true">volunteer_activism</mat-icon></span>
      <span>Kinemo</span>
    </a>
    <mat-nav-list aria-label="Módulos de Kinemo">
      @for (option of options; track option.link) {
        <a mat-list-item [routerLink]="option.link" routerLinkActive="active" ariaCurrentWhenActive="page"
          [attr.aria-label]="option.label" (click)="mobileOpen.set(false)">
          <mat-icon matListItemIcon aria-hidden="true">{{ option.icon }}</mat-icon>
          <span matListItemTitle>{{ option.label }}</span>
        </a>
      }
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content class="content-shell">
    <header class="account-bar">
      @if (narrow()) {
        <button mat-icon-button type="button" (click)="mobileOpen.set(!mobileOpen())"
          aria-label="Menú de módulos" aria-controls="module-menu" [attr.aria-expanded]="mobileOpen()">
          <mat-icon>menu</mat-icon>
        </button>
      }
      <div class="account-actions">
        <a mat-button class="account-link" [routerLink]="auth.isAuthenticated() ? '/profile' : '/login'">
          <mat-icon>account_circle</mat-icon>{{ auth.isAuthenticated() ? 'Mi perfil' : 'Iniciar sesión' }}
        </a>
      </div>
    </header>
    <main class="page-content kinemo-workspace">
      <router-outlet />
    </main>
    <app-footer-content />
  </mat-sidenav-content>
</mat-sidenav-container>

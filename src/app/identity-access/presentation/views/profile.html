<div class="profile-container">
  <mat-card class="profile-card">

    <mat-card-header>
      <mat-card-title>Mi perfil</mat-card-title>
      <mat-card-subtitle>
        Consulta y actualiza tus datos personales
      </mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form *ngIf="profile" (ngSubmit)="saveProfile()">

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Nombres</mat-label>
          <input matInput name="firstName"
                 [(ngModel)]="profile.firstName" required />
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Apellidos</mat-label>
          <input matInput name="lastName"
                 [(ngModel)]="profile.lastName" required />
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Teléfono</mat-label>
          <input matInput name="phone"
                 [(ngModel)]="profile.phone" />
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Correo electrónico</mat-label>
          <input matInput [value]="email" readonly />
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Rol</mat-label>
          <input matInput [value]="role" readonly />
        </mat-form-field>

        <p *ngIf="message()" class="success-message">
          {{ message() }}
        </p>

        <button mat-flat-button type="submit"
                class="save-button" [disabled]="loading()">
          {{ loading() ? 'Guardando...' : 'Guardar cambios' }}
        </button>

      </form>

      <p *ngIf="errorMessage()" class="error-message">
        {{ errorMessage() }}
      </p>
    </mat-card-content>

  </mat-card>
</div>

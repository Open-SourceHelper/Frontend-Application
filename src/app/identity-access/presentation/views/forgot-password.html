
<div class="recovery-container">
  <mat-card class="recovery-card">
    <mat-card-header>
      <mat-card-title>Recuperar contraseña</mat-card-title>
      <mat-card-subtitle>
        Simulación de recuperación de cuenta de Kinemo
      </mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form (ngSubmit)="resetPassword()">

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Correo electrónico</mat-label>
          <input
            matInput
            type="email"
            name="email"
            [(ngModel)]="email"
            required
          />
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Nueva contraseña</mat-label>
          <input
            matInput
            type="password"
            name="newPassword"
            [(ngModel)]="newPassword"
            required
          />
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Confirmar contraseña</mat-label>
          <input
            matInput
            type="password"
            name="confirmPassword"
            [(ngModel)]="confirmPassword"
            required
          />
        </mat-form-field>

        <p *ngIf="errorMessage()" class="error-message">
          {{ errorMessage() }}
        </p>

        <p *ngIf="successMessage()" class="success-message">
          {{ successMessage() }}
        </p>

        <button
          mat-flat-button
          type="submit"
          class="submit-button"
          [disabled]="loading()"
        >
          {{ loading() ? 'Actualizando...' : 'Cambiar contraseña' }}
        </button>

      </form>
    </mat-card-content>

    <mat-card-actions>
      <a routerLink="/login">Volver al inicio de sesión</a>
    </mat-card-actions>
  </mat-card>
</div>


<div class="login-container">
  <mat-card class="login-card">

    <mat-card-header>
      <mat-card-title>Bienvenido a Kinemo</mat-card-title>
      <mat-card-subtitle>
        Inicia sesión para continuar
      </mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form (ngSubmit)="login()">

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Correo electrónico</mat-label>
          <input
            matInput
            type="email"
            name="email"
            [(ngModel)]="email"
            required
          />
          <mat-icon matPrefix>email</mat-icon>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Contraseña</mat-label>
          <input
            matInput
            name="password"
            [type]="hidePassword() ? 'password' : 'text'"
            [(ngModel)]="password"
            required
          />
          <button
            mat-icon-button
            matSuffix
            type="button"
            (click)="hidePassword.set(!hidePassword())"
            aria-label="Mostrar u ocultar contraseña"
          >
            <mat-icon>
              {{ hidePassword() ? 'visibility_off' : 'visibility' }}
            </mat-icon>
          </button>
        </mat-form-field>

        <p *ngIf="errorMessage()" class="error-message">
          {{ errorMessage() }}
        </p>

        <button
          mat-flat-button
          type="submit"
          class="login-button"
          [disabled]="loading()"
        >
          {{ loading() ? 'Ingresando...' : 'Iniciar sesión' }}
        </button>

      </form>
    </mat-card-content>

    <p>
        ¿No tienes una cuenta?
      <a routerLink="/register">Regístrate aquí</a>
    </p>

  </mat-card>
</div>

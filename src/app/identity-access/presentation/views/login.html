
<div class="login-container">
  <div class="login-panel">
    <section class="login-brand" aria-label="Kinemo">
      <mat-icon aria-hidden="true">volunteer_activism</mat-icon>
      <span>Kinemo</span>
      <p>Organiza el cuidado y comparte lo importante con tu red de confianza.</p>
    </section>
    <mat-card class="login-card">

    <mat-card-header>
      <mat-card-title><h1>Bienvenido a Kinemo</h1></mat-card-title>
      <mat-card-subtitle>
        Inicia sesión para continuar
      </mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form (ngSubmit)="login()">

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Correo electrónico</mat-label>
          <input
            matInput
            type="email"
            name="email"
            autocomplete="email"
            [(ngModel)]="email"
            required
          />
          <mat-icon matPrefix>email</mat-icon>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Contraseña</mat-label>
          <input
            matInput
            name="password"
            autocomplete="current-password"
            [type]="hidePassword() ? 'password' : 'text'"
            [(ngModel)]="password"
            required
          />

          <button
            mat-icon-button
            matSuffix
            type="button"
            (click)="hidePassword.set(!hidePassword())"
            aria-label="Mostrar u ocultar contraseña"
          >
            <mat-icon>
              {{ hidePassword() ? 'visibility_off' : 'visibility' }}
            </mat-icon>
          </button>
        </mat-form-field>

        <p>
          <a routerLink="/forgot-password">¿Olvidaste tu contraseña?</a>
        </p>

        <p *ngIf="errorMessage()" class="error-message" role="alert">
          {{ errorMessage() }}
        </p>

        <button
          mat-flat-button
          type="submit"
          class="login-button"
          [disabled]="loading()"
        >
          {{ loading() ? 'Ingresando...' : 'Iniciar sesión' }}
        </button>

      </form>
    </mat-card-content>

    <p class="register-link">
        ¿No tienes una cuenta?
      <a routerLink="/register">Crear cuenta</a>
    </p>

    </mat-card>
  </div>
</div>
